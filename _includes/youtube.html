{% if include.vertical %}
<div class="video-vertical">
  <iframe
    src="https://www.youtube.com/embed/{{ include.id }}"
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>
{% else %}
<div class="video-container">
  <iframe
    src="https://www.youtube.com/embed/{{ include.id }}"
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>
{% endif %}

<style>
.video-container {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
  max-width: 100%;
  margin: 1.5em 0;
}
.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
.video-vertical {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 9 / 16;
  margin: 1.5em auto;
}
.video-vertical iframe {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
