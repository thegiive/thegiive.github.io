{% assign post_image = page.image | default: '/assets/images/default-og.png' %}
{% unless post_image contains '://' %}
  {% assign post_image = site.url | append: post_image %}
{% endunless %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "Wisely Chen",
    "url": "https://www.wiselychen.com/",
    "jobTitle": "AI-Assisted Development Consultant",
    "sameAs": [
      "https://www.linkedin.com/in/{{ site.social.linkedin }}",
      "https://github.com/{{ site.social.github }}"
    ]
  },
  "publisher": {
    "@type": "Organization",
    "name": "Wisely Chen AI Coding",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.url }}/assets/images/logo.png"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ page.url }}"
  },
  "image": "{{ post_image }}",
  "description": {{ page.description | strip_html | truncate: 200 | jsonify }},
  "speakable": {
    "@type": "SpeakableSpecification",
    "cssSelector": [".post-title", ".post-description"]
  }
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "首頁",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": "{{ site.url }}{{ page.url }}"
    }
  ]
}
</script>

{% if page.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in page.faq %}
    {
      "@type": "Question",
      "name": {{ item.question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.answer | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
